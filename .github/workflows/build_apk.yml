name: "Compilar APK"

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para publicar la release

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Leer version de la app
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version detectada: $VERSION"

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             EasyCompra-${{ steps.version.outputs.version }}.apk

      # Queda descargable desde la pestana Actions aunque no se publique release.
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: EasyCompra-${{ steps.version.outputs.version }}
          path: EasyCompra-${{ steps.version.outputs.version }}.apk
          retention-days: 90

      # La release da un enlace fijo desde el que instalar en el movil.
      # Se sobreescribe si ya existe una con la misma version.
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$VERSION" \
            "EasyCompra-$VERSION.apk" \
            --title "EasyCompra $VERSION" \
            --notes "APK de depuracion, lista para instalar.

          Los datos se descargan de https://github.com/elopositor/EasyCompra-datos
          y se actualizan solos cada dia. No hace falta arrancar ningun servidor."
