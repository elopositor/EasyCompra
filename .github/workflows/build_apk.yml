name: "Compilar APK"

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Solo lectura: este workflow ya no publica la APK en ninguna parte.
    permissions:
      contents: read

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-

      # Sin esto cada compilacion firmaria con un certificado distinto y el
      # movil pediria desinstalar la app antes de cada actualizacion.
      - name: Restaurar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Sin ANDROID_KEYSTORE_B64: se firmara con la clave de depuracion."
          else
            echo "$KEYSTORE_B64" | base64 -d > android/easycompra.jks
            echo "Clave de firma restaurada."
          fi

      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Borrar la clave del disco
        if: always()
        run: rm -f android/easycompra.jks

      - name: Leer version de la app
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version detectada: $VERSION"

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             EasyCompra-${{ steps.version.outputs.version }}.apk

      # NO se publica la APK. En un repositorio publico, tanto una release
      # como un artefacto de Actions son descargables por cualquiera, y la app
      # se distribuye solo en privado. Este workflow queda como verificacion de
      # que el proyecto Android sigue compilando.
      - name: Comprobar que la APK se ha generado
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ls -lh "EasyCompra-$VERSION.apk"
          echo "Compilacion correcta. La APK no se publica: se genera solo para verificar el build."

      - name: Descartar la APK
        if: always()
        run: rm -f EasyCompra-*.apk
